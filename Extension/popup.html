<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../../src/styles/common.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <button id="optionsBtn" class="options-arrow" title="Options">
      <img src="assets/arrow.png" alt="Options">
    </button>
    <div id="petContainer">
      <img id="petImage" src="assets/happy_pet.jpg" alt="Tamagotcha Pet">
      <div class="health-bar-container">
        <div id="healthBarFill" class="health-bar-fill"></div>
        <span id="healthText">100/100</span>
      </div>
      <button id="reviveBtn" class="btn secondary" style="display: none; margin-top: 10px;">Revive Pet</button>
    </div>
    <div class="timer-display" id="timerDisplay">5:00</div>
    <div class="controls">
      <button id="startBtn" class="btn">Start</button>
      <button id="pauseBtn" class="btn" disabled>Pause</button>
      <button id="resetBtn" class="btn">Reset</button>
    </div>
    <div id="authSection">
      <div id="signedOut">
        <button id="signInBtn" class="btn">Sign in with Google</button>
        <div id="error-msg" style="display:none; color:red;"></div>
      </div>
      <div id="signedIn" style="display:none">
        <p id="userName"></p>
        <a href="#" id="signOutBtn" class="text-link">Sign Out</a>
      </div>
    </div>
  </div>
  <script src="../../src/utils/timer.js"></script>
  <script src="../../src/utils/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
