<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Screen Time Tamagotcha</title>
  <link rel="stylesheet" href="options.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">

    <!-- Left: Stats -->
    <div class="panel stats-panel">
      <h2>Capy Stats</h2>
      <p>Age: <span id="statAge">0 days</span></p>
      <p>Deceased Pets: <span id="statDeceased">0</span></p>
      <p>Longest lifespan: <span id="statLongest">0 days</span></p>
      <p>Total hours studied: <span id="statHours">0</span></p>
      <p>Longest study time:<br><span id="statLongestStudy">0:00</span></p>
    </div>

    <!-- Center: Pet + Timer -->
    <div class="panel main-panel">
      <img id="petImage" src="assets/happy_pet.jpg" alt="Capy" class="pet-image">
      <div class="health-bar-wrap">
        <div class="health-bar-track">
          <div id="healthBar" class="health-bar-fill"></div>
        </div>
        <span id="healthPct" class="health-pct">100%</span>
      </div>
      <button id="reviveBtn" class="add-site-btn" style="display: none; margin-top: 10px; width: auto; align-self: center;">Revive Pet</button>
      <h3 id="sessionLabel">Study Time</h3>
      <p id="nextInfo" class="next-info">Next: 00:05:00 break</p>
      <div class="timer-row">
        <button id="pauseBtn" class="icon-btn" title="Stop">⏸</button>
        <div id="timerDisplay" class="timer-display">25:00</div>
        <button id="resetBtn" class="icon-btn" title="Reset">↺</button>
      </div>
    </div>

    <!-- Right: Blocked Sites -->
    <div class="panel blocked-panel">
      <h2>Blocked Sites</h2>
      <p class="blocked-sub">Choose websites to block if you visit them during study time.</p>
      <button id="toggleAddForm" class="add-site-btn">＋ Add new site</button>
      <div id="addSiteForm" class="add-site-form hidden">
        <input type="text" id="newSiteInput" placeholder="youtube.com">
        <button id="confirmAdd" class="confirm-add">✓</button>
      </div>
      <ul id="blockedList" class="blocked-list"></ul>
    </div>

  </div>
  <div class="grass-strip"></div>
  <script src="options.js"></script>
</body>
</html>
