<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Site Blocked</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', 'Segoe UI', sans-serif;
      background: #FFF3E4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }

    .card {
      background: #FFF3E4;
      border: 6px solid #FDE0BC;
      border-radius: 16px;
      padding: 40px 48px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      position: relative;
      z-index: 2;
      transform: translateY(-60px);
    }
    

    .pet-img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #6D420A;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      color: #B07040;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .timer-label {
      font-size: 12px;
      font-weight: 600;
      color: #B07040;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .countdown {
      font-size: 48px;
      font-weight: 800;
      color: #6D420A;
      font-family: 'Courier New', monospace;
      background: #FDE0BC;
      border-radius: 10px;
      padding: 8px 20px;
      display: inline-block;
      letter-spacing: 2px;
    }

    .grass {
      height: 250px;
      width: 100%;
      
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 3;
      background-image: url("./assets/grass.png");
      background-repeat: repeat-x;
      background-position: bottom;
      background-size: auto 500px;
    }

  </style>
</head>
<body>
  <div class="card">
    <img class="pet-img" id="petImg" src="assets/pet_healthy.png" alt="Capy">
    <h1>Site Blocked!</h1>
    <p>Your Capy is counting on you.<br>Stay focused until your timer is up.</p>
    <div class="timer-label">Time remaining</div>
    <div class="countdown" id="countdown">--:--</div>
  </div>
  <div class="grass"></div>

  <script src="blocked.js"></script>
</body>
</html>
