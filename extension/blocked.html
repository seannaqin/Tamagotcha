<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Site Blocked</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', 'Segoe UI', sans-serif;
      background: #FFF3E4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }

    .card {
      background: #FFF3E4;
      border: 6px solid #FDE0BC;
      border-radius: 16px;
      padding: 40px 48px;
      text-align: center;
      max-width: 420px;
      width: 90%;
    }

    .pet-img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #6D420A;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      color: #B07040;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .timer-label {
      font-size: 12px;
      font-weight: 600;
      color: #B07040;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .countdown {
      font-size: 48px;
      font-weight: 800;
      color: #6D420A;
      font-family: 'Courier New', monospace;
      background: #FDE0BC;
      border-radius: 10px;
      padding: 8px 20px;
      display: inline-block;
      letter-spacing: 2px;
    }

    .grass {
      width: 100%;
      max-width: 420px;
      height: 28px;
      background: #7db966;
      border: 6px solid #FDE0BC;
      border-top: 3px solid #a2d48a;
      border-radius: 0 0 10px 10px;
      margin-top: -6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="pet-img" id="petImg" src="assets/pet_healthy.png" alt="Capy">
    <h1>Site Blocked!</h1>
    <p>Your Capy is counting on you.<br>Stay focused until your timer is up.</p>
    <div class="timer-label">Time remaining</div>
    <div class="countdown" id="countdown">--:--</div>
  </div>
  <div class="grass"></div>

  <script>
    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function update() {
      chrome.storage.local.get(['session', 'pet'], (data) => {
        const { session, pet } = data;

        if (pet) {
          if (pet.status === 'dead') {
            document.getElementById('petImg').src = 'assets/pet_dead.png';
          } else if (pet.status === 'sad') {
            document.getElementById('petImg').src = 'assets/pet_sad.png';
          }
        }

        if (!session || !session.isActive) {
          document.getElementById('countdown').textContent = '00:00';
          return;
        }

        const remaining = Math.max(0, Math.floor((session.endTime - Date.now()) / 1000));
        document.getElementById('countdown').textContent = formatTime(remaining);

        if (remaining <= 0) {
          document.getElementById('countdown').textContent = '00:00';
        }
      });
    }

    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
